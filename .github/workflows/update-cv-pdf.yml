name: Build LaTeX CV and Publish

on:
  push:
    branches:
      - main
    paths:
      - cv/Resume.tex
      - .github/workflows/update-cv-pdf.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cv-latex-source-build
  cancel-in-progress: false

jobs:
  latex-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compile original LaTeX template
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Resume.tex
          working_directory: cv
          compiler: latexmk
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Validate two-page CV and newest publication entry
        run: |
          python -m pip install --quiet pymupdf
          python - <<'PY'
          import pymupdf
          pdf = pymupdf.open("cv/Resume.pdf")
          assert len(pdf) == 2, f"Expected two-page CV, got {len(pdf)}"
          text = "\n".join(page.get_text() for page in pdf)
          assert "Stigmatizing Yourself" in text
          assert "Yitong Hao" in text
          for marker in ["Cornell University", "PROFESSIONAL EXPERIENCE", "ADDITIONAL INFORMATION"]:
              assert marker in text, f"Missing original CV section: {marker}"
          font_names = {font[3] for page in pdf for font in page.get_fonts()}
          assert not any("Liberation" in name for name in font_names)
          print("Two-page original LaTeX CV verified:", sorted(font_names))
          PY

      - name: Update publicly served CV PDF
        run: |
          cp cv/Resume.pdf public/CV_Hao_Huang.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/CV_Hao_Huang.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Recompile website CV using original LaTeX template"
            git push origin HEAD:main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: latex-build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
